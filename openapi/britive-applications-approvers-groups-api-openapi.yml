security:
- bearerAuth: []
tags:
- name: Applications - Approvers Groups
  description: Manage approvers groups for association approvers
paths:
  /api/apps/{appId}/approvers-groups:
    post:
      tags:
      - Applications - Approvers Groups
      summary: Create approvers groups for association approvers
      operationId: createApproversGroup
      parameters:
      - name: appId
        in: path
        description: id of the application.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproversGroupDto'
        required: true
      responses:
        '200':
          description: Successfully retrieved approvers groups for an application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproversGroupDto'
    get:
      tags:
      - Applications - Approvers Groups
      summary: Get approvers groups for association approvers combination
      operationId: getApproversGroups
      parameters:
      - name: appId
        in: path
        description: id of the application.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved access request settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproversGroupsSummary'
  /api/apps/{appId}/approvers-groups/{groupId}:
    delete:
      tags:
      - Applications - Approvers Groups
      summary: Delete approval groups for access request settings
      operationId: deleteApproversGroup
      parameters:
      - name: appId
        in: path
        description: id of the application.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: id of the approval group.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Approvers group deleted
        '404':
          description: Approvers group id not found
    get:
      tags:
      - Applications - Approvers Groups
      summary: Get approvers groups for a given id
      operationId: getApproversGroupsById
      parameters:
      - name: appId
        in: path
        description: id of the application.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: id of the approval group.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved access request settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproversGroupDto'
        '404':
          description: Approvers group id not found
    patch:
      tags:
      - Applications - Approvers Groups
      summary: Update approvers group for given id
      operationId: updateApproversGroup
      parameters:
      - name: appId
        in: path
        description: id of the application.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: id of the approval group.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproversGroupDto'
        required: true
      responses:
        '204':
          description: Approvers groups updated
        '404':
          description: Approvers group id not found
components:
  schemas:
    MemberDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        memberType:
          type: string
          enum:
          - User
          - Tag
    ApproversGroupDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        condition:
          type: string
          enum:
          - All
          - Any
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberDto'
    ApproversGroupsSummary:
      type: object
      properties:
        approversGroupSummary:
          type: array
          items:
            $ref: '#/components/schemas/ApproversGroupDto'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
