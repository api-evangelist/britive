openapi: 3.2.0
info:
  title: Britive Services API Documentation Resource Manager API
  version: v1
  description: API documentation for Users, Tags, Identity providers, Applications, Reporting, Audit logs, Tenants, SSO, Profiles, Password policies, MFA, Access Builder Settings, etc.
servers:
- url: https://{tenantURL}
  description: The primary server
  variables:
    tenantURL:
      default: test.britive-app.com
      description: The host of the server
security:
- bearerAuth: []
tags:
- name: Resource Manager
  description: Manage Resources
paths:
  /api/resource-manager/resources:
    get:
      tags:
      - Resource Manager
      summary: Get all resources
      operationId: getResources_1
      parameters:
      - in: query
        name: filter
        description: Parameter to filter resources by name
        required: false
        schema:
          type: string
          example: name eq profile1
      - in: query
        name: searchText
        description: Parameter to filter profiles by search text
        required: false
        schema:
          type: string
          example: test
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
    post:
      tags:
      - Resource Manager
      summary: Manage resources
      operationId: saveResource
      requestBody:
        description: Information to save resource
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDto'
      responses:
        '201':
          description: Resource saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
  /api/resource-manager/resources/{id}:
    delete:
      tags:
      - Resource Manager
      summary: Delete resource
      operationId: deleteResource
      parameters:
      - name: id
        in: path
        description: ID of the resource to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Resource deleted successfully
        '404':
          description: Not Found
    get:
      tags:
      - Resource Manager
      summary: Get resource by ID
      operationId: getResourceById
      parameters:
      - name: id
        in: path
        description: ID of the resource to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resource retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
        '404':
          description: Not Found
    put:
      tags:
      - Resource Manager
      summary: Update resource
      operationId: updateResource
      parameters:
      - name: id
        in: path
        description: ID of the resource to partially update
        required: true
        schema:
          type: string
      requestBody:
        description: Information to save resource
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDto'
      responses:
        '200':
          description: Resource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
  /api/resource-manager/resources/{id}/broker-pools:
    get:
      tags:
      - Resource Manager
      summary: Get broker pools by resource ID
      operationId: getBrokerPoolsByResourceId
      parameters:
      - name: id
        in: path
        description: ID of the resource mapped to broker pools
        required: true
        schema:
          type: string
      - in: query
        name: searchText
        description: Parameter to filter broker pools by search text
        required: false
        schema:
          type: string
          example: test
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Broker pools retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrokerPoolDetailsDto'
        '404':
          description: Not Found
    post:
      tags:
      - Resource Manager
      summary: Manage resource broker pools
      operationId: addBrokerPoolsToResource
      parameters:
      - name: id
        in: path
        description: ID of the resource mapped to broker pools
        required: true
        schema:
          type: string
      requestBody:
        description: Map broker pools to resource
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '201':
          description: Broker pools added successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/resource-manager/resources/{id}/broker-pools/{brokerPoolId}:
    delete:
      tags:
      - Resource Manager
      summary: Delete broker poold for a resource
      operationId: removeBrokerPoolForResourceId
      parameters:
      - name: id
        in: path
        description: ID of the resource mapped to broker pools
        required: true
        schema:
          type: string
      - name: brokerPoolId
        in: path
        description: brokerPoolId to be deleted.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Broker pool deleted successfully
        '404':
          description: Not Found
