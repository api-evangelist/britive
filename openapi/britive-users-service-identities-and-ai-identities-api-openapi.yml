        status:
          type: string
    UserBeanRequest:
      type: object
      properties:
        username:
          type: string
        status:
          type: string
          enum:
          - inactive
          - active
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        emailList:
          type: array
          items:
            type: string
        sharePasswordToUser:
          type: boolean
        password:
          type: string
        identityProvider:
          type: string
