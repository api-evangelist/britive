        relationships:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/IdentityRelationship'
    UserBeanResult:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        size:
          type: string
        sort:
          type: string
        filter:
          type: string
