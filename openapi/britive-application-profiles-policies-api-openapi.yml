          type: array
          items:
            $ref: '#/components/schemas/RoleDto'
        resources:
          uniqueItems: true
          type: array
          items:
            type: string
        accessLevel:
          type: string
        resource:
          type: string
        consumer:
          type: string
        accessType:
          type: string
        resourceLabels:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PermissionDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        consumer:
          type: string
        actions:
          uniqueItems: true
          type: array
          items:
            type: string
        resources:
          uniqueItems: true
          type: array
          items:
            type: string
        isInline:
          type: boolean
        isReadOnly:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
