          items:
            $ref: '#/components/schemas/PermissionScope'
        privileged:
          type: boolean
        source:
          type: string
    PermissionScope:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        scopeId:
          type: integer
          format: int64
        parentId:
          type: string
        nativeId:
          type: string
