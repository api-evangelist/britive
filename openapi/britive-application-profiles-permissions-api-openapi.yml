    Page:
      name: page
      in: query
      required: false
      description: Parameter to specify the page number of the records to retrieve
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: parameter to specify the number of records to retrieve per page
      schema:
        type: integer
        default: 20
  schemas:
    AppContainerPapPermissionActionHelper:
      type: object
      properties:
        op:
          type: string
          enum:
          - add
          - remove
        permission:
          $ref: '#/components/schemas/AppContainerPapPermission'
    AppContainerPapPermission:
      type: object
      properties:
        name:
          pattern: ^((?!(\=)|(\-\-)).)*$
