paths:
  /api/paps/{papId}/permissions:
    post:
      tags:
      - Application Profiles - Permissions
      summary: Add profile permissions to a specified profile
      operationId: addOrRemovePapPermissions_1
      parameters:
      - name: papId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppContainerPapPermissionActionHelper'
            example:
              op: add
              permission:
                papId: n5unkqz5a2jme537o05c
                name: BDK8Role
                type: role
                description: null
                checkStatus: Success
                message: ''
                privileged: 'true'
                source: britive
                profilePermissionConstraintsSummaryDTO: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
    get:
      tags:
      - Application Profiles - Permissions
      summary: Get a list of all permissions assigned to a profile for a specified profile
      operationId: getPapPermissions_2
      parameters:
      - name: papId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
