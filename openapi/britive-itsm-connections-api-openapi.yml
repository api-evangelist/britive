        consumer:
          type: string
        entityType:
          type: string
        url:
          type: string
        entityData:
          type: object
    ItsmConnection:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        authType:
          type: string
        name:
          type: string
        description:
          type: string
    ItsmConnectionDetails:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        authType:
          type: string
        name:
          type: string
        description:
          type: string
        data:
          type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
