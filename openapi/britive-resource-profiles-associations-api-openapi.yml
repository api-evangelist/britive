openapi: 3.2.0
info:
  title: Britive Services API Documentation Resource Profiles - Associations API
  version: v1
  description: API documentation for Users, Tags, Identity providers, Applications, Reporting, Audit logs, Tenants, SSO, Profiles, Password policies, MFA, Access Builder Settings, etc.
servers:
- url: https://{tenantURL}
  description: The primary server
  variables:
    tenantURL:
      default: test.britive-app.com
      description: The host of the server
security:
- bearerAuth: []
tags:
- name: Resource Profiles - Associations
  description: Manage Resource Profiles Associations
paths:
  /api/resource-manager/profiles/{id}/associations:
    post:
      tags:
      - Resource Profiles - Associations
      summary: Add associations to resource profile
      operationId: AddProfileAssociations
      parameters:
      - name: id
        in: path
        description: Id of profile to add permission
        required: true
        schema:
          type: string
      requestBody:
        description: Add resource associations to profile
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAssociationDto'
      responses:
        '200':
          description: resource association got added to profile successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAssociationDto'
        '404':
          description: Not Found
    get:
      tags:
      - Resource Profiles - Associations
      summary: Get associations to resource profile
      operationId: getProfileAssociations
      parameters:
      - name: id
        in: path
        description: Id of profile to add permission
        required: true
        schema:
          type: string
      responses:
        '200':
          description: resource associations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAssociationDto'
        '404':
          description: Not Found
components:
  schemas:
    LabelAssociation:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    ProfileAssociationDto:
      type: object
      properties:
        associations:
          $ref: '#/components/schemas/LabelAssociation'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
