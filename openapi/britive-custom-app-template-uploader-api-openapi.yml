openapi: 3.2.0
info:
  title: Britive Services API Documentation Custom App Template…
  version: v1
  description: API documentation for Users, Tags, Identity providers, Applications, Reporting, Audit logs, Tenants, SSO, Profiles, Password policies, MFA, Access Builder Settings, etc.
servers:
- url: https://{tenantURL}
  description: The primary server
  variables:
    tenantURL:
      default: test.britive-app.com
      description: The host of the server
security:
- bearerAuth: []
tags:
- name: Custom App Template Uploader
  description: Uploads custom app template.
paths:
  /api/generic-apps/templates:
    post:
      tags:
      - Custom App Template Uploader
      summary: Uploads a custom app template
      description: This endpoint is used to upload a custom app template.
      operationId: upload
      requestBody:
        required: 'true'
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                templateFile:
                  type: string
                  format: binary
                  description: The app template file (.yaml or .baml).
              required:
              - templateFile
      responses:
        '202':
          description: 'Successfully uploaded custom app template. Provisioning in progress.

            To check whether template is ready for usage, use get /api/generic-apps/templates

            to see if template if available.

            '
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
