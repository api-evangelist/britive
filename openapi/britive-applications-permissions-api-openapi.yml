      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/apps/{appContainerId}/environments/{environmentId}/permissions:
    get:
      tags:
      - Applications - Permissions
      summary: Get details of all permissions associated with a given application and environment
      operationId: getEnvironmentPermissions
      parameters:
      - name: appContainerId
        in: path
        required: true
        schema:
          type: string
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
      - name: includeMembers
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
