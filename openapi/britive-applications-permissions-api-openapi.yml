      - Applications - Permissions
      summary: Get membership changes for permissions between the last two consecutive scans
      operationId: getEnvironmentPermissionChanges
      parameters:
      - name: appContainerId
        in: path
        required: true
        schema:
          type: string
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
