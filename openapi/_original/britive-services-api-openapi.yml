  /api/paps/sessions/{id}:
    delete:
      tags:
      - Application Profiles - Sessions
      summary: Check in an active session by transaction ID
      description: Checks in the application profile session identified by the given transaction ID. The operation is idempotent
        - checking in an already checked-in session succeeds without effect. Sessions with access type `DEVICE` cannot be
        checked in through this API. An audit event of type ADMIN_ACCESS_CHECKIN is generated.
      operationId: checkInProfileForTransaction
      parameters:
      - name: id
        in: path
        required: true
        description: The transaction ID of the session to check in
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid transaction ID, or the session cannot be checked in through this API
    get:
      tags:
      - Application Profiles - Sessions
      summary: Get a list of active sessions for a specific user
      description: Returns the active sessions (sessions in any state other than checked in or checkout failed) of the specified
        user. Supported filter attributes are `profileName`, `appName`, `environmentName`, `environmentId`, `accessType` (values
        `CONSOLE`, `PROGRAMMATIC`) and `appType`; the `in` operator is supported for `appName` and `appType` only. If `searchText`
        is provided, it takes precedence over `filter` and is applied as `profileName co <searchText>`.
      operationId: getCheckedOutProfilesForUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user whose active sessions are returned
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAccessStatusSummary'
        '400':
          description: Invalid filter criteria
