      parameters:
      - name: type
        in: query
        description: the type of identity provider.
        required: false
        schema:
          type: string
          enum:
          - OIDC
          - AWS
          - SCIM
          - SPIFFE
      - name: name
        in: query
        description: filter resource that starts with name
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: '0'
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: '1'
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort
          criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: successfully retrieve workload identity providers by page
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/AwsProvider'
                  - $ref: '#/components/schemas/OpenIdConnectProvider'
                  - $ref: '#/components/schemas/SpiffeProvider'
    put:
      tags:
      - Workload Identity Providers
      summary: Update workload identity provider
      operationId: updateIdentityProvider
      requestBody:
        content:
          application/json:
            schema:
              description: The existing identity provider to update.
              oneOf:
              - $ref: '#/components/schemas/AwsProvider'
              - $ref: '#/components/schemas/OpenIdConnectProvider'
              - $ref: '#/components/schemas/SpiffeProvider'
        required: true
      responses:
        '200':
          description: identity provider updated
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AwsProvider'
                - $ref: '#/components/schemas/OpenIdConnectProvider'
                - $ref: '#/components/schemas/SpiffeProvider'
        '404':
          description: identity provider not found
        '405':
          description: invalid identity provider
  /api/workload/identity-providers/{idpId}:
    delete:
      tags:
      - Workload Identity Providers
      summary: Delete identity provider
      operationId: deleteIdentityProvider
      parameters:
      - name: idpId
        in: path
        description: id of the identity provider.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: identity provider deleted.
    get:
      tags:
      - Workload Identity Providers
      summary: Get identity provider details
      operationId: getIdentityProvider
      parameters:
      - name: idpId
        in: path
        description: Id of the identity provider.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: identity provider retrieved
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AwsProvider'
                - $ref: '#/components/schemas/OpenIdConnectProvider'
                - $ref: '#/components/schemas/SpiffeProvider'
        '404':
          description: identity provider not found
  /api/workload/scim-user/identity-provider:
    post:
      tags:
      - Workload SCIM Identity Providers
      summary: Designate user to authenticate as for scim provisioning
      operationId: designateScimUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUserIdentityProvider'
        required: true
      responses:
        '200':
          description: successfully added or updated the user for scim provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimUserIdentityProvider'
  /api/workload/scim-user/identity-provider/{idpName}:
    delete:
      tags:
      - Workload SCIM Identity Providers
      summary: Delete user SCIM identity provider association
      operationId: deleteScimUserIdentityProvider
      parameters:
      - name: idpName
        in: path
        description: Name of the identity provider
        required: true
        schema:
          type: string
      responses:
        '200':
          description: user SCIM identity provider association deleted.
    get:
      tags:
      - Workload SCIM Identity Providers
      summary: Identity provider SCIM provisioning assigned service identity
      operationId: getScimUserIdentityProvider
      parameters:
      - name: idpName
        in: path
        description: Name of the identity provider
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success retrieving the identity provider's SCIM provisioning assigned service identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimUserIdentityProvider'
  /api/workload/users/{targetUserId}/identity-provider:
    post:
      tags:
      - Workload Service Identity Providers
      summary: Assign service identity's authenticating identity provider
      operationId: assignIdentityProvider
      parameters:
      - name: targetUserId
        in: path
        description: The random 20 alphanumeric string id of the service identity user.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignateIdpRequest'
        required: true
      responses:
        '200':
          description: Successfully assigned identity provider to service identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDesignatedIdp'
    delete:
      tags:
      - Workload Service Identity Providers
      summary: Delete service identity's assigned identity provider for authentication
      description: Revert service identity back to use a static API token for authentication by deleting the user identity
        provider assignment.
      operationId: removeAssignedIdentityProvider
      parameters:
      - name: targetUserId
        in: path
        description: The random 20 alphanumeric string id of the service identity user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: user identity provider assignment deleted.
    get:
      tags:
      - Workload Service Identity Providers
      summary: Get service identity's identity provider for authentication
      operationId: getUserIdentityProvider
      parameters:
      - name: targetUserId
        in: path
        description: The random 20 alphanumeric string id of the service identity user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success retrieving the service identity's authenticating identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDesignatedIdp'
