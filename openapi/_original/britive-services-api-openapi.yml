          type: string
          description: Unique transaction identifier; required for getTokens, getConsoleUrl, and check-in calls
          example: txn_abc123
        papId:
          type: string
          description: Profile (PAP) string identifier
          example: pap_xyz456
        appContainerId:
          type: string
          description: Application container identifier
          example: app_123
        environmentId:
          type: string
          description: Environment identifier
          example: env_789
        userId:
          type: string
          description: User identifier (string form)
          example: user_001
        status:
          type: string
          description: Current lifecycle status of the checkout operation
          enum:
          - checkedOut
          - checkedIn
          - checkedInExpired
          - checkOutSubmitted
          - checkOutInProgress
          - checkOutFailed
          - checkInSubmitted
          - checkInInProgress
          - checkInFailed
          - checkOutTimeOut
          - checkInTimeOut
