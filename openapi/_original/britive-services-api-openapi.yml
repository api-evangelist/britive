        required: true
        schema:
          type: string
      - name: accessType
        in: query
        description: 'Type of access to checkout. `CONSOLE` grants a federated web-console session; `PROGRAMMATIC` grants
          short-lived API credentials; `CLI` (default) for CLI-based access.

          '
        required: false
        schema:
          type: string
          enum:
          - CLI
          - CONSOLE
          - PROGRAMMATIC
          default: CLI
      - name: type
        in: query
        description: Legacy alias for `accessType`. Ignored when `accessType` is provided.
        required: false
        schema:
          type: string
