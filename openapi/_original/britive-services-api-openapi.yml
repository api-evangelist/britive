    CheckoutVariablePrompt:
      type: object
      description: 'Signal to the UI that checkout will prompt the end user for the named variable''s value. The variable''s
        type discriminates the rendered control and the server-side validation rule applied to the submitted value.

        '
      properties:
        variableName:
          type: string
          description: Name of the variable declared on the resolved permission.
        type:
          type: string
          enum:
          - String
          - password
          description: 'String -> text input. password -> masked input. Either way the value must match regexPattern when
            one is present; the server re-validates at checkout.

            '
        regexPattern:
          type: string
          description: 'Present iff a regex pattern is configured for this variable on the profile-permission binding (any
            type). UI validates live; server enforces at checkout (400 RM-0025 on mismatch).

            '
        description:
          type: string
          description: 'Optional human-readable explanation of regexPattern, surfaced next to the input so the end user understands
            what a valid value looks like. Present iff a description is configured on the profile-permission binding (which
            itself requires regexPattern).

            '
