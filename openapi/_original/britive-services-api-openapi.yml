openapi: 3.0.1
info:
  title: Britive Services API Documentation
  version: v1
  description: API documentation for Users, Tags, Identity providers, Applications, Reporting, Audit logs, Tenants, SSO, Profiles,
    Password policies, MFA, Access Builder Settings, etc.
servers:
- url: https://{tenantURL}
  description: The primary server
  variables:
    tenantURL:
      default: test.britive-app.com
      description: The host of the server
security:
- bearerAuth: []
tags:
- name: Access Request Tag Membership
  description: Manage tag memberships granted via access requests
- name: API Tokens
  description: Manage API Tokens
- name: Application Environments
  description: Manage Application Environments
- name: Application Environments - Accounts
  description: Manage Application Environments Accounts
- name: Application Profiles
  description: Manage Application Profiles
- name: Application Profiles - Advanced Settings
  description: Manage Application Profiles Advanced Settings
- name: Application Profiles - Permissions
  description: Manage Application Profiles Permissions
- name: Application Profiles - Permission Constraint Manager
  description: Manage Profile Permission Constraints for the permissions that support to define constraints.
- name: Application Profiles - Policies
  description: Manage Application Profiles Policies
- name: Application Profiles - Scopes
  description: Manage Application Profiles Scopes
- name: Application Profiles - Session Attributes
  description: Manage Application Profiles Session Attributes
- name: Application Profiles - Sessions
  description: Manage Application Profiles Sessions
- name: Application Profiles - Users and Tags
  description: Manage Application Profiles
- name: Applications
  description: Manage Applications
- name: Applications - Access Builder Settings
  description: Manage access builder settings for an application
- name: Applications - Advanced Settings
  description: Manage Applications Advanced Settings
- name: Applications - Approvers Groups
  description: Manage approvers groups for association approvers
- name: Applications - Association Approvers
  description: Manage association approvers for an application
- name: Applications - Managed Permissions
  description: Manage Britive Permissions
- name: Applications - Permissions
  description: Manage Application Permissions
- name: Applications - Root Environment Groups
  description: Manage Application Root Environment Groups
- name: Applications - Scans
  description: Manage Application Scans
- name: Audit Log Webhooks
  description: Manage Audit Log Webhooks
- name: Audit Logs
  description: Manage Audit Logs
- name: Custom App Template Uploader
  description: Uploads custom app template.
- name: Custom App Manager
  description: Creates an app using custom template and other operations for managing the template.
- name: Global Landing Page
  description: Manage global landing page
- name: Identity Providers
  description: Manage identity providers and settings
- name: IP Restrictions
  description: Manage firewall rules/settings
- name: ITSM Connection Metadata
  description: Manage ITSM Connection Metadata
- name: ITSM Connections
  description: Manage ITSM Connections
- name: ITSM Integration
  description: Manage ITSM Connections
- name: IM Connection Metadata
  description: Manage IM Connection Metadata
- name: IM Connections
  description: Manage IM Connections
- name: IM Integration
  description: Manage IM Connections
- name: Multi Factor Authentication
  description: Manage MFA authentication settings
- name: My Access
  description: Manage My Access
- name: My Devices
  description: Manage My Devices
- name: My Resources
  description: Manage My Resources
- name: My Resources - Integration
  description: Manage My Resource Integration
- name: My Resources - Profiles
  description: Manage My Resource Profiles
- name: Notifications
  description: Manage notifications
- name: Profile Requests - Managed Permissions
  description: Manage Profile Requests Britive Permissions
- name: Reports
  description: Manage Reports
- name: Resource Manager
  description: Manage Resources
- name: Resource Manager - Labels
  description: Manage Resource Labels
- name: Resource Manager - Permissions
  description: Manage Resource Permissions
- name: Resource Manager - Policies
  description: Manage Resource Policies
- name: Resource Manager - Response Templates
  description: Manage Resource Response Templates
- name: Resource Manager - Types
  description: Manage Resource Types
- name: Resource Profiles
  description: Manage Resource Profiles
- name: Resource Profiles - Advanced Settings
  description: Manage Resource Profiles Advanced Settings
- name: Resource Profiles - Associations
  description: Manage Resource Profiles Associations
- name: Resource Profiles - Permissions
  description: Manage Resource Profiles Permissions
- name: Resource Profiles - Policies
  description: Manage Resource Profiles Policies
- name: SAML Configuration
  description: Manage SAML Configuration
- name: Step Up Authentication
  description: Manage service identity association to identity provider
- name: System Announcements
  description: Manage the system announcements
- name: Tag Access Request Settings
  description: Manage access request settings for a user tag
- name: Tag Access Requests
  description: Browse tags available for access request
- name: Task Scheduler
  description: Manage Tasks
- name: User Identity Attributes
  description: Manage User Identity Attributes
- name: User Resources
  description: Manage User Built Resources
- name: User Tags
  description: Manage User Tags
- name: Users, Service Identities and AI Identities
  description: Manage Users, Service Identities and AI Identities
- name: Workload Identity Providers
  description: Manage workload identity providers
- name: Workload SCIM Identity Providers
  description: Manage service identity association to SCIM provisioning for identity provider
- name: Workload Service Identity Providers
  description: Manage service identity association to identity provider
- name: User Tag Owner
  description: Tag Owners manage the tag memberships of their owned tags
- name: Shared Signals - Catalog
  description: Manage shared signals catalog data
- name: Shared Signals - Issuers
  description: Manage shared signals issuers
- name: Shared Signals - Receivers
  description: Manage shared signals receivers
- name: Shared Signals - Results
  description: Query shared signals processing results
paths:
  /api/access:
    get:
      tags:
      - My Access
      summary: Get all profiles associated with the user with an API token
      operationId: getMyAccess
      parameters:
      - name: page
        in: query
        description: page number of my-access profile list. Default is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: size of the request for my-access profile list. Default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        description: Filters for my-access profiles that can be applied - appName, papName, environmentName, environmentId,
          appType. Operators - eq, sw, co
        required: false
        schema:
          type: string
        example: appName eq "AWS"
      - name: sort
        in: query
        description: Sorting of my-access profiles that can be applied - appName, papName, environmentName, environmentId,
          appType. Operators - asc, desc
        required: false
        schema:
          type: string
        example: appName,ASC
      - name: searchText
        in: query
        description: Search by all fields.
        required: false
        schema:
          type: string
        example: searchText=AWS
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccessSummary'
  /api/access-requests/tags:
    get:
      tags:
      - Tag Access Requests
      summary: List requestable tags
      description: Returns tags where the current user is not already a member and the tag is marked as requestable.
      operationId: getRequestableTags
      parameters:
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on tag name
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of requestable tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestableTagPageDto'
    post:
      tags:
      - Tag Access Requests
      summary: Submit a tag access request
      operationId: submitTagAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAccessRequest'
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid request payload
  /api/access-requests/tags/{tagId}/app-profiles:
    get:
      tags:
      - Tag Access Requests
      summary: List application profiles for a tag
      description: Returns application profiles accessible via the given tag.
      operationId: getTagAppProfiles
      parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on profile name
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of application profiles for the tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAppProfilePageDto'
        '404':
          description: Tag not found
  /api/access-requests/tags/{tagId}/approvers:
    get:
      tags:
      - Tag Access Requests
      summary: Get approvers for a tag
      operationId: getApproversForTag
      parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approvers object
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Invalid tagId
  /api/access-requests/tags/{tagId}/resources:
    get:
      tags:
      - Tag Access Requests
      summary: List resources for a tag
      description: Returns resources accessible via the given tag.
      operationId: getTagResources
      parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on resource name
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of resources for the tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResourcePageDto'
        '404':
          description: Tag not found
  /api/access-requests/tags/{tagId}/secrets:
    get:
      tags:
      - Tag Access Requests
      summary: List secrets for a tag
      description: Returns secrets accessible via the given tag.
      operationId: getTagSecrets
      parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on secret name
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated list of secrets for the tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSecretPageDto'
        '404':
          description: Tag not found
  /api/access/devices:
    get:
      tags:
      - My Devices
      summary: Get all device profiles associated with the user with an API token
      operationId: getMyDevices
      parameters:
      - name: page
        in: query
        description: page number of profile list. Default is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: size of the request for profile list. Default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        description: Filters for device profiles that can be applied - appName, papName, deviceName, platformName, accountName,
          deviceId, appType. Operators - eq, sw, co
        required: false
        schema:
          type: string
        example: deviceName eq "Mac-1000"
      - name: sort
        in: query
        description: Sorting of device profiles that can be applied - appName, papName, deviceName, platformName, accountName,
          deviceId, appType. Operators - asc, desc
        required: false
        schema:
          type: string
        example: appName,ASC
      - name: searchText
        in: query
        description: Search by all fields.
        required: false
        schema:
          type: string
        example: searchText=Linux
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccessSummary'
  /api/access/devices/{transactionId}:
    put:
      tags:
      - My Devices
      summary: Check in profile for a device
      description: 'Check in a previously checked-out profile session. The `transactionId` is returned by the checkout call.
        Terminates the active session and revokes any issued credentials.

        '
      operationId: checkinProfile
      parameters:
      - name: transactionId
        in: path
        description: Transaction ID returned by the checkout call
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Check-in completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAccessStatusResponse'
        '404':
          description: Transaction not found
  /api/access/frequently-used:
    get:
      tags:
      - My Access
      summary: Get all frequently-used profiles for the logged-in user
      operationId: myAccessUI
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/access/user-tags/my-managed-tags:
    get:
      tags:
      - User Tag Owner
      summary: List tags managed by the current user
      description: 'Returns all tags where the authenticated user is an owner, either directly (their identity is recorded
        as an Owner) or indirectly (they are a member of a tag that is itself an Owner). Supports optional name filtering
        and pagination. When the `page` parameter is omitted the raw list is returned; when `page` is supplied a full `UserTagSummary`
        (with count/page/size) is returned.

        '
      operationId: getMyManagedTags
      parameters:
      - name: filter
        in: query
        required: false
        description: Filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on tag name (URL-encoded)
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of managed tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTagSummary'
  /api/access/user-tags/{tagId}:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    get:
      tags:
      - User Tag Owner
      summary: Get details of an owned tag
      description: 'Returns full details of the specified tag. Returns 403 if the authenticated user is not an owner of this
        tag.

        '
      operationId: getOwnedTagDetails
      responses:
        '200':
          description: Tag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTagDto'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/attribute-criteria:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    post:
      tags:
      - User Tag Owner
      summary: Add attribute criteria to an owned tag
      description: 'Adds attribute-based membership criteria to the specified tag. Returns 403 if the authenticated user is
        not an owner.

        '
      operationId: addOwnedTagAttributeCriteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserTagAttributeCriteriaDto'
      responses:
        '200':
          description: Criteria added successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTagAttributeCriteriaDto'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
    get:
      tags:
      - User Tag Owner
      summary: Get attribute criteria of an owned tag
      description: 'Returns the attribute-based membership criteria for the specified tag. Returns 403 if the authenticated
        user is not an owner.

        '
      operationId: getOwnedTagAttributeCriteria
      responses:
        '200':
          description: List of attribute criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTagAttributeCriteriaDto'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
    patch:
      tags:
      - User Tag Owner
      summary: Update attribute criteria of an owned tag
      description: 'Replaces attribute-based membership criteria on the specified tag. Returns 403 if the authenticated user
        is not an owner.

        '
      operationId: updateOwnedTagAttributeCriteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserTagAttributeCriteriaDto'
      responses:
        '204':
          description: Criteria updated successfully
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/available-users:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PageSize'
    get:
      tags:
      - User Tag Owner
      summary: Get available members for an owned tag
      description: 'Returns active users who are not yet members of the specified tag. Returns 403 if the authenticated user
        is not an owner.

        '
      operationId: getOwnedTagAvailableMembers
      parameters:
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on user name (URL-encoded)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of available users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/matched-users:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/Sort'
    get:
      tags:
      - User Tag Owner
      summary: Get users matched by tag attribute criteria
      description: 'Returns users that match the attribute-based membership criteria of the specified tag. Returns 403 if
        the authenticated user is not an owner.

        '
      operationId: getOwnedTagMatchedUsers
      parameters:
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on user name (URL-encoded)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of matched users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/requested-memberships:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PageSize'
    - $ref: '#/components/parameters/Sort'
    get:
      tags:
      - User Tag Owner
      summary: Get requested memberships of an owned tag
      description: 'Returns users whose is_user_requested flag is true for the specified tag. Returns 403 if the authenticated
        user is not an owner.

        '
      operationId: getOwnedTagRequestedMemberships
      parameters:
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on user name (URL-encoded)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of requested memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/requested-memberships/{userId}:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - in: path
      name: userId
      required: true
      schema:
        type: string
      description: External string ID of the user (e.g. puXXXXXX)
    delete:
      tags:
      - User Tag Owner
      summary: Remove a requested membership from an owned tag
      description: 'Clears the is_user_requested flag for the specified user in the tag. If this was the only active access
        path, the row is deleted and deprovisioning is triggered. Returns 403 if the authenticated user is not an owner.

        '
      operationId: removeOwnedTagRequestedMembership
      responses:
        '200':
          description: Requested membership removed successfully
        '403':
          description: Forbidden
        '404':
          description: User not found in tag
  /api/access/user-tags/{tagId}/users:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PageSize'
    get:
      tags:
      - User Tag Owner
      summary: Get members of an owned tag
      description: 'Returns the current members of the specified tag. Returns 403 if the authenticated user is not an owner.

        '
      operationId: getOwnedTagMembers
      parameters:
      - name: filter
        in: query
        required: false
        description: SCIM-style filter string (e.g. `name co "foo"`)
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        description: Free-text search on user name (URL-encoded)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of tag members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
  /api/access/user-tags/{tagId}/users/{userId}:
    parameters:
    - in: path
      name: tagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    - in: path
      name: userId
      required: true
      schema:
        type: string
      description: External string ID of the user (e.g. puXXXXXX)
    post:
      tags:
      - User Tag Owner
      summary: Add a member to an owned tag
      description: 'Adds the specified user to the tag. Returns 403 if the authenticated user is not an owner.

        '
      operationId: addOwnedTagMember
      responses:
        '200':
          description: User added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Bad request
        '403':
          description: Forbidden — authenticated user is not an owner of this tag
        '404':
          description: Tag not found
    delete:
      tags:
      - User Tag Owner
      summary: Remove a member from an owned tag
      description: 'Removes the specified user from the tag. Returns 403 if the authenticated user is not an owner.

        '
      operationId: removeOwnedTagMember
      responses:
        '200':
          description: User removed successfully
        '403':
          description: Forbidden
        '404':
          description: User not found in tag
  /api/access/user-tags/{userTagId}/members:
    parameters:
    - in: path
      name: userTagId
      required: true
      schema:
        type: string
      description: ID of the user tag
    get:
      tags:
      - User Tags
      summary: Get members of a user tag
      description: 'Returns all users who are members of the specified user tag. Optionally includes dynamically assigned
        users when `fetchDynamicallyAssignedUsers` is set to `true`.

        '
      operationId: getAccessUserTagMembers
      parameters:
      - name: fetchDynamicallyAssignedUsers
        in: query
        required: false
        description: When true, also includes users assigned via dynamic attribute criteria
        schema:
          type: boolean
          default: false
      responses:
