      description: 'Checkout a profile for a specific environment. Use `accessType=CONSOLE` to obtain a federated console
        session or `accessType=PROGRAMMATIC` to obtain short-lived programmatic credentials (e.g. AWS access keys). The response
        `transactionId` is required for subsequent getToken, getConsoleUrl, and check-in calls. For ITSM-gated profiles, supply
        `ticketId` and `ticketType` in the request body.

        '
