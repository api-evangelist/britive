notes: >-
  Release notes are prose per release, dated, and archived monthly. They are not published as a
  machine-readable feed — there is no RSS/Atom, JSON changelog or per-release API. There is also
  no API-level changelog: the notes cover the platform, not the REST contract, so an API consumer
  cannot tell from them whether an endpoint, field or error code changed.
