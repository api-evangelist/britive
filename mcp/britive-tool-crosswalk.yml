  - file: openapi/britive-services-api-openapi.yml
    operations: 372
    gated: false
  - file: openapi/britive-secrets-manager-api-openapi.yml
    operations: 71
    gated: false
  mcp:
    url_template: https://{tenant}.britive-app.com/mcp
    probed: https://demo.britive-app.com/mcp
    gated: true
    gate: 'OAuth 2.0 tenant login; tools/list returns 401 invalid_token anonymously'
  graphql: none

coverage:
  mcp_tools: 53
  crosswalked: 51
  mcp_only: 2
  rest_operations_total: 443
  rest_operations_bound: 27
  rest_only: 416
  note: >-
    The MCP surface is deliberately narrow. 53 tools reach 27 of 443 published REST operations
    (6.1%) — and 19 of the 53 tools are one-per-report wrappers over a single operation. The
    agent surface covers self-service access (check-out/check-in), identity read + enable/disable,
    audit-log query, reporting and session termination. Everything administrative — profile,
    policy, permission, application, environment, identity-provider, SCIM, secret-template and
    Shared Signals configuration — is REST-only.

