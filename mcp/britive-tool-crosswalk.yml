generated: '2026-08-08'
method: derived
source: >-
  mcp/britive-mcp.yml (tool names + params read from https://github.com/britive/mcp-server),
  https://github.com/britive/python-sdk (the SDK call each tool makes, and the REST path that
  SDK method builds), openapi/britive-services-api-openapi.yml and
  openapi/britive-secrets-manager-api-openapi.yml (operationIds)
note: >-
  Britive's MCP server is a thin wrapper over its own Python SDK: every @mcp.tool function
  calls exactly one `client.<module>.<method>()`. That makes the binding unusually traceable —
  the SDK method's base_url + path resolves directly onto a path in the published OpenAPI, so
  most rows are high confidence and inherit the REST operation's real parameters as the tool's
  effective inputSchema. Rows are medium confidence where the SDK method assembles the path
  dynamically or fans out over more than one operation. Nothing here is invented: no row is
  emitted for a tool whose backing call could not be traced to a published operation.

surfaces:
