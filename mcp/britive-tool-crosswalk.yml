mcp_only:
- tool: my_access_whoami
  reason: >-
    Backed by POST {base}/access/whoami in the SDK, which is not documented in Britive's
    published OpenAPI.
- tool: my_resources_list_checked_out_profiles
  reason: >-
    A client-side filter over GET /api/resource-manager/my-resources; there is no dedicated
    published operation for checked-out resource profiles.

rest_only_summary:
  count: 419
  families:
  - Application Profiles (PAPs), their permissions, policies, scopes, session attributes
  - Applications, environments, environment groups, scans, managed permissions
  - Access Builder settings, approvers groups, association approvers
  - Identity providers, SAML, SCIM tokens and mappings, workload identity providers
  - Policy administration (policies, roles, permissions, actions, consumers)
  - Secrets Manager administration (vaults, templates, password policies, rotation)
  - Shared Signals Framework issuers, receivers, catalog and results
  - Audit-log webhooks, notification mediums, workflow notifications
  - API tokens, step-up authentication, security policies, tenant settings
  note: >-
    Not a defect on its own — a PAM vendor exposing only self-service access and read
    operations to agents, and keeping policy administration REST-only, is a defensible
    design choice for this category.

defects:
- kind: duplicate-operationId
  detail: >-
    Eight operationIds are used twice across Britive's published contracts, so they are not
    unique and cannot be used as a key by a generated client or an agent toolchain.
  ids: [checkinProfile, checkoutProfile, createPermission, deletePermission, updatePermission,
    getPasswordPolicy, deletePolicy, getResourceById]
  source: openapi/britive-services-api-openapi.yml, openapi/britive-secrets-manager-api-openapi.yml
- kind: undocumented-operation
  detail: >-
    Two operations the MCP server and SDK depend on are not in either published OpenAPI:
    POST {base}/access/whoami and GET {base}/resource-manager/sessions.
