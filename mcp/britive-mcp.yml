generated: '2026-08-08'
method: searched
source: https://docs.britive.com/docs/setting-up-mcp-server + https://github.com/britive/mcp-server
name: Britive MCP Server
status: published
vendor: Britive, Inc.
description: >-
  Britive ships a first-party Model Context Protocol server that lets AI agents and MCP
  clients (Claude Desktop, VS Code Copilot) drive the Britive platform: request just-in-time
  privileged access, check access back in, list identities and tags, query audit logs, run
  reports and terminate active sessions. It is offered two ways — a remote, OAuth-protected
  server on the customer's own tenant, and an open-source local server run from the Britive
  GitHub organization.

deployments:
- kind: remote
  url_template: https://{tenant}.britive-app.com/mcp
  probed_url: https://demo.britive-app.com/mcp
  transport: streamable-http
  status: live
  x-evidence:
    fetched: '2026-08-08'
    method: 'POST tools/list (jsonrpc 2.0)'
    http_status: 401
    error: invalid_token
    www_authenticate: >-
      Bearer error="invalid_token", resource_metadata="https://demo.britive-app.com/.well-known/oauth-protected-resource/mcp"
    server_header: uvicorn
    note: >-
      The endpoint is live and answers MCP JSON-RPC, but both tools/list and initialize are
      auth-gated behind the tenant OAuth flow. The tool inventory below is therefore taken
      from Britive's own open-source server source, not from a live tools/list response.
  auth:
    scheme: OAuth 2.0 (tenant login, SSO or username/password) via MCP client custom connector
    rfc9728_challenge: true
    rfc9728_metadata_served: false
    defect: >-
      The WWW-Authenticate challenge advertises resource_metadata at
      https://{tenant}.britive-app.com/.well-known/oauth-protected-resource/mcp, but that URL
      returns 404. The alternate form /mcp/.well-known/oauth-protected-resource returns 200
      with the tenant SPA HTML rather than JSON. No OAuth protected-resource metadata document
      is actually served, so a spec-compliant MCP client cannot complete discovery from the
      challenge alone.
- kind: local
  repository: https://github.com/britive/mcp-server
  runtime: Python >= 3.10 (fastmcp)
  status: open-source
  auth:
    - PyBritive CLI login (recommended) — `pybritive login`
    - static Britive API token via BRITIVE_STATIC_TOKEN
  environment:
    BRITIVE_TENANT: tenant subdomain
    BRITIVE_STATIC_TOKEN: optional static token
    BRITIVE_EMAIL: optional, enables on-behalf-of (OBO) mode
  containerized: true

