rfc9457: false
note: Britive does not use RFC 9457 application/problem+json. It returns a proprietary JSON error envelope on application/json,
  carrying a stable, documented, namespaced error code. The envelope and the full code list below are published
  verbatim by Britive; the HTTP status distribution under `observed_in_spec` is derived from the two OpenAPI documents
  in openapi/.
envelope:
  media_type: application/json
  fields:
  - name: status
    type: integer
    description: HTTP status code, repeated in the body
  - name: message
    type: string
    description: Human-readable error message
  - name: errorCode
    type: string
    description: Stable namespaced Britive error code, e.g. A-0003
  - name: details
    type: string|null
    description: Additional detail, null when not applicable
  example:
    status: 400
    message: App id '62hnp3zkv5jx1p8k74zj' does not exist.
    errorCode: A-0003
    details: null
  example_source: https://docs.britive.com/apidocs/api-status-codes.md
