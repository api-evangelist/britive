apis:
- aid: britive:britive-secrets-manager-api
  name: Britive Secrets Manager API
  description: >-
    The Britive Secret Manager API covers the Britive vault and secrets lifecycle — vault initialization,
    static and file secrets, secret versions, secret metadata, password policies, secret templates and
    secret rotation history — plus the shared policy-administration surface (policies, roles, permissions,
    actions, consumers), the approvals workflow and the notification-medium/notification service.
  humanURL: https://docs.britive.com/apidocs
  baseURL: https://demo.britive-app.com/api/v1
  tags:
  - Secrets Management
  - Vault
  - Policy
  - Approvals
  properties:
  - type: OpenAPI
    url: openapi/britive-secrets-manager-api-openapi.yml
  - type: Overlay
    url: overlays/britive-secrets-manager-api-overlay.yaml
  - type: Documentation
    url: https://docs.britive.com/apidocs
  - type: APIReference
    url: https://docs.britive.com/apidocs
- aid: britive:britive-mcp-server
  name: Britive MCP Server
  description: >-
    Britive's first-party Model Context Protocol server, available both as a remote server on the tenant
    (https://{tenant}.britive-app.com/mcp, OAuth-protected) and as an open-source local server (github.com/britive/mcp-server).
    It exposes Britive dynamic access, identity management, reporting, audit-log query and active-session
    tools to MCP clients such as Claude Desktop and VS Code Copilot.
  humanURL: https://docs.britive.com/docs/setting-up-mcp-server
  baseURL: https://demo.britive-app.com/mcp
  tags:
  - MCP
  - Agentic AI
  - Access Control
