    url: mcp/britive-mcp.yml
  - type: ToolCrosswalk
    url: mcp/britive-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.britive.com/docs/setting-up-mcp-server
  - type: SourceCode
    url: https://github.com/britive/mcp-server
