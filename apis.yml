aid: britive
name: Britive
description: 'Britive is a runtime privileged access management (PAM) platform that
  issues just-in-time, ephemeral privileges to human users, non-human identities and
  AI agents across AWS, Azure, GCP, Oracle Cloud, Kubernetes, Snowflake, Okta, Salesforce,
  ServiceNow and on-premises systems, so organizations can operate with zero standing
  privileges. The platform is API-first and agentless: a tenant-scoped REST API at
  https://{tenant}.britive-app.com/api covers applications, environments, profiles
  (PAPs), policies, identities, tags, secrets, approvals, audit logs and reporting,
  and is complemented by an open-source Python SDK, the PyBritive CLI, a Terraform
  provider, SCIM provisioning, Shared Signals Framework (CAEP/RISC/SET) issuers and
  receivers, audit-log webhooks, and a first-party MCP server for AI agents.'
url: https://raw.githubusercontent.com/api-evangelist/britive/refs/heads/main/apis.yml
image: https://images.prismic.io/britive/ajXRGI1P9HI4UwTa_BritiveRuntimePrivilegedAccessManagementforforAgenticAI%2CNHI%26Humans.png
