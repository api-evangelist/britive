entities:
- name: Tenant
  description: The customer's isolated Britive instance; the root of every other object and of the base URL.
  root_path: https://{tenant}.britive-app.com
- name: Application
  aka: AppContainer
  description: An onboarded cloud or SaaS target (AWS, Azure, GCP, Oracle, Okta, Snowflake, Salesforce, ServiceNow, ...).
  path: /api/apps
  key_schemas: [AppContainerBean, ApplicationSummary, CatalogApplication]
- name: Environment
  description: A scanned scope inside an application (an AWS account, a GCP project, an Azure subscription).
  path: /api/apps/{appContainerId}/environments
  key_schemas: [Environment, DefaultEnvironment]
- name: EnvironmentGroup
  description: A hierarchical grouping of environments within an application.
  path: /api/apps/{appContainerId}/environment-groups
  key_schemas: [EnvironmentGroup, DefaultEnvironmentGroup]
- name: Profile
  aka: PAP (Privileged Access Profile)
  description: The central object — a bundle of permissions in an application that an identity may check out for a bounded time.
  path: /api/apps/{appContainerId}/paps
  key_schemas: [AppContainerPapPermission, DefaultPapScope, AccessProfileSettings, AccessPeriod]
- name: ProfilePermission
  description: A permission attached to a profile, optionally narrowed by constraints.
  path: /api/paps/{papId}/permissions
- name: ProfilePolicy
  description: An ordered policy governing who may check a profile out and under what conditions.
  path: /api/paps/{papId}/policies
- name: Account
  description: A native account discovered in an environment by a scan.
  path: /api/apps/{appContainerId}/environments/{environmentId}/accounts
- name: Permission
  description: A native permission discovered in an environment.
  path: /api/apps/{appContainerId}/environments/{environmentId}/permissions
  key_schemas: [ApplicationPermission, ApplicationPermissionDefinition]
- name: Scan
  description: A discovery run over an application or environment; produces accounts, groups and permissions and a membership delta.
  path: /api/apps/{appContainerId}/environments/{environmentId}/scans
- name: User
  description: A human identity.
  path: /api/users
- name: ServiceIdentity
  description: A non-human identity (workload, service account, AI identity), sharing the /api/users collection.
  path: /api/users
- name: Tag
  aka: UserTag
  description: A group of identities, static or dynamically matched by attribute criteria; the usual subject of a policy.
  path: /api/user-tags
- name: IdentityProvider
  description: An external IdP federated into Britive, optionally with SCIM provisioning.
  path: /api/identity-providers
- name: ApiToken
  description: A bearer credential minted by a user, inheriting that user's privileges.
  path: /api/users/{targetUserId}/tokens
  key_schemas: [ApiToken, ApiTokenBean]
- name: Checkout
  aka: Session / Transaction
  description: An active grant of a profile to an identity, identified by transactionId, ended by check-in.
  path: /api/paps/sessions
- name: Resource
  description: An Access Broker target that is not a cloud/SaaS application — Linux hosts, GKE, Google Workspace, databases.
  path: /api/resource-manager
- name: ResourceType
  description: The template describing a class of resource and the permissions it supports.
  path: /api/resource-manager/resource-types
- name: ResourceProfile
  description: A checkout-able bundle of resource permissions, the resource-side analogue of a Profile.
  path: /api/resource-manager/profiles
- name: Vault
  description: The tenant's secret store.
  path: /api/v1/secretmanager/vault
- name: Secret
  description: A static or file secret in a vault, versioned, optionally rotated on a schedule.
  path: /api/v1/secretmanager/vault/{vaultId}/secrets
- name: PasswordPolicy
  description: A policy governing generated secret values.
  path: /api/v1/secretmanager/pwdpolicies
- name: Policy
  description: The shared policy-administration object used by system, secret and resource surfaces.
  path: /api/v1/policy-admin/policies
- name: Role
  description: A named bundle of permissions, referenced by policies.
  path: /api/v1/policy-admin/roles
- name: ApprovalRequest
  description: A pending request for access requiring approver action.
  path: /api/v1/approvals
  key_schemas: [ApprovalRequestData, AutoApprovalSettings, ApproversGroupDto]
- name: AuditLog
  description: The immutable event log, queried with a field/operator expression language.
  path: /api/logs
- name: AuditLogWebhook
  description: A webhook that pushes audit events matching a filter expression to a notification medium.
  path: /api/logs/webhooks
  key_schemas: [AuditLogWebhook]
- name: NotificationMedium
  description: A delivery channel — email, email with magic link, Slack, Microsoft Teams, or a Teams webhook URL.
  path: /api/v1/notification-service/notificationmediums
- name: SharedSignalsIssuer
  aka: Transmitter
  description: An external IdP whose SSF security events Britive consumes, with event-to-action mappings.
  path: /api/shared-signals/issuers
  key_schemas: [CreateIssuerRequest, BritiveActionDefinition]
- name: SharedSignalsReceiver
  description: An external system Britive transmits SSF events to, with Britive-event-to-standard-event mappings.
  path: /api/shared-signals/receivers
  key_schemas: [CreateReceiverRequest, BritiveEventTypeDefinition]
- name: Report
  description: A canned analytics report, runnable as JSON or CSV with a filter expression.
  path: /api/reports

