scope: >-
  The entity graph of the Britive platform as it is expressed in the published REST contract.
  Relationships are derived from two signals: nesting in the URL hierarchy (an authoritative
  containment signal) and id-suffixed reference fields in component schemas. Where Britive types
  a response as a bare `{type: object}` the entity is still listed if the path proves it exists.

