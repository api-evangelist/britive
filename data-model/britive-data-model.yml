gaps:
- >-
  Ids carry no type prefix, so an agent holding an id cannot tell what it refers to without the
  field name that produced it.
- >-
  Many list and detail responses are declared as bare `{type: object}`, so the relationships
  above are read from path structure and request bodies more than from response schemas.
- >-
  There is no object-reference page in the documentation — no per-entity field dictionary — so
  the data model must be inferred from the API reference rather than read.
